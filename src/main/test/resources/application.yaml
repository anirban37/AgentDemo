# ============================================================
# application.yaml - AgentDemo API Configuration
# All property values MUST be quoted strings per Mule Runtime
# YAML configuration properties loader requirements.
# ============================================================

# HTTP Listener Configuration
http:
  host: "0.0.0.0"
  port: "8081"
  basePath: "/api/v1/*"

# Downstream API Configuration - https://api.restful-api.dev
downstream:
  host: "api.restful-api.dev"
  port: "443"
  protocol: "HTTPS"

# Application Metadata
app:
  name: "AgentDemo"
  version: "v1"
  env: "dev"